name: noteboard

services:
  # ==================== Backend Services ====================
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noteboard_api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8000:8000"
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - noteboard_network

  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noteboard_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - noteboard_network

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    container_name: noteboard_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:3000:3000"
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-noteboard_secret_key}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://backend_api:8000
    depends_on:
      - backend_api
    networks:
      - noteboard_network

  # ==================== Databases ====================
  postgres:
    image: postgres:alpine
    container_name: noteboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noteboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noteboard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-noteboard}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noteboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noteboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: noteboard_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - noteboard_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20
    container_name: noteboard_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_secret}
      NEO4J_PLUGINS: '["apoc"]'
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - noteboard_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.25.0
    container_name: noteboard_weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    expose:
      - "8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - noteboard_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== Caddy Reverse Proxy (Optional) ====================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./nginx/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend_api
    networks:
      - noteboard_network

# ==================== Networks ====================
networks:
  noteboard_network:
    driver: bridge
    name: noteboard_network

# ==================== Volumes ====================
volumes:
  postgres_data:
    name: noteboard_postgres_data
  redis_data:
    name: noteboard_redis_data
  neo4j_data:
    name: noteboard_neo4j_data
  neo4j_logs:
    name: noteboard_neo4j_logs
  weaviate_data:
    name: noteboard_weaviate_data
  caddy_data:
    name: noteboard_caddy_data
  caddy_config:
    name: noteboard_caddy_config