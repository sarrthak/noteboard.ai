name: Deploy to GCP Production

on:
  push:
    branches: [ main, feature/* ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: noteboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Target Directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          script: mkdir -p ~/${{ env.DEPLOY_DIR }}

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          source: "backend/,frontend/,nginx/,docker-compose.yml,package.json"
          target: "~/${{ env.DEPLOY_DIR }}"

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          envs: PROD_ENV_FILE,DEPLOY_DIR
          script_stop: true
          script: |
            cd ~/$DEPLOY_DIR

            # Write .env from secret (printf preserves content exactly)
            printf '%s' "$PROD_ENV_FILE" > .env

            # Build and restart containers
            docker compose down
            docker compose up -d --build

            # Wait for backend to be healthy before migrating
            echo "Waiting for backend to start..."
            for i in $(seq 1 30); do
              if docker compose exec -T backend_api python -c "print('ready')" 2>/dev/null; then
                break
              fi
              sleep 2
            done

            # Run database migrations
            docker compose exec -T backend_api alembic upgrade head

            # Verify all services are running
            docker compose ps

            # Prune only dangling images (safe)
            docker image prune -f
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}